services:
  api:
    build: { context: ., target: app }
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
      MCP_URL: http://notes-mcp:9000/mcp
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}   # override from the shell: GROQ_MODEL=openai/gpt-oss-20b docker compose up -d
      ASSESSMENT_DEBUG: "1"          # exposes /debug/telemetry and /debug/assessment
      CHECKPOINT_DB: /data/checkpoints.sqlite   # chat memory (task 2: make it a SQLite checkpointer)
      KB_DB: /data/kb.sqlite       # document registry + session profiles
      UPLOAD_DIR: /data            # uploaded files: /data/uploads/<session>/
      OTEL_SERVICE_NAME: extraction-agent
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317   # gRPC: host:port, no scheme
      AGENT_MAX_STEPS: "25"
    depends_on:
      migrate: { condition: service_completed_successfully }   # the users database must be migrated first
      qdrant: { condition: service_started }
      notes-mcp: { condition: service_started }
      otel-collector: { condition: service_started }
    volumes:
      - app_data:/data
    restart: unless-stopped

  migrate:   # one-shot task: applies your Alembic migrations (src/app/migrations) to /data/users.sqlite, then exits
    build: { context: ., target: app }
    command: ["alembic", "upgrade", "head"]
    environment:
      KB_DB: /data/kb.sqlite
    volumes:
      - app_data:/data

  ui:   # Gradio: a plain API client (no agent code)
    build: { context: ., target: app }
    command: ["python", "ui/app.py"]
    ports:
      - "7860:7860"
    environment:
      API_URL: http://api:8000
      PUBLIC_API_URL: http://localhost:8000   # charts open in the browser, so this must be reachable from it
    depends_on:
      - api
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  notes-mcp:
    build: { context: ., target: app }
    command: ["python", "mcp_server/notes_server.py", "--http"]
    environment:
      NOTES_FILE: /data/notes.json
    ports:
      - "9000:9000"
    volumes:
      - notes_data:/data

  # ---- observability: app -> collector -> Tempo / Prometheus / Loki -> Grafana ----
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.152.0   # contrib: spanmetrics + otlphttp
    command: ["--config=/etc/otel/config.yml"]
    volumes:
      - ./observability/otel-collector-config.yml:/etc/otel/config.yml:ro
    ports:
      - "4317:4317"   # OTLP gRPC (apps)
      - "4318:4318"   # OTLP HTTP
    depends_on: [tempo, loki]

  tempo:
    image: grafana/tempo:2.8.2
    command: ["-config.file=/etc/tempo/config.yml"]
    volumes:
      - ./observability/tempo-config.yml:/etc/tempo/config.yml:ro
      - tempo_data:/var/tempo   # /var/tempo, not /tmp (named-volume permission errors)

  loki:
    image: grafana/loki:3.0.0
    command: ["-config.file=/etc/loki/config.yml"]
    volumes:
      - ./observability/loki-config.yml:/etc/loki/config.yml:ro
      - loki_data:/loki

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on: [otel-collector]

  grafana:
    image: grafana/grafana-oss:12.1.0
    environment:   # demo only: anonymous admin. Use real auth in production.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/agent-overview.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./src/app/dashboards:/var/lib/grafana/dashboards-student:ro   # your own dashboards (JSON files)
      - grafana_data:/var/lib/grafana/data
    ports:
      - "3000:3000"
    depends_on: [prometheus, loki, tempo]

networks:
  default:
    ipam:   # explicit subnet: with a VPN's 0.0.0.0/1 route Docker's auto-allocation reports "pools fully subnetted"
      config:
        - subnet: 172.30.50.0/24

volumes:
  app_data:
  qdrant_data:
  notes_data:
  tempo_data:
  loki_data:
  prometheus_data:
  grafana_data:
